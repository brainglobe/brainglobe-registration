name: tests

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
  schedule:
  # Runs at 6:10am UTC on Monday
    - cron: '10 6 * * 1'

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/lint@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0

  manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/check_manifest@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0

  get-week-number:
    runs-on: ubuntu-latest
    outputs:
        WEEK_NUMBER: ${{ steps.get-week-number.outputs.WEEK_NUMBER }}
    steps:
    - name: Get week number
      id: get-week-number
      run: echo "WEEK_NUMBER=$(date -u '+%V')" >> "$GITHUB_OUTPUT"

  test:
    needs: [linting, manifest, get-week-number]
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Run all supported Python versions on linux
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
        - os: macos-latest # ARM Mac
          python-version: "3.13"
        - os: windows-latest
          python-version: "3.13"

    steps:
      - name: Cache Atlases
        id: atlas-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: | # ensure we don't cache any interrupted atlas download and extraction, if e.g. we cancel the workflow manually
            ~/.brainglobe
            !~/.brainglobe/atlas.tar.gz
          key: brainglobe-${{ runner.os }}-${{ needs.get-week-number.outputs.WEEK_NUMBER }}
          restore-keys: |
              brainglobe-${{ runner.os }}-${{ needs.get-week-number.outputs.WEEK_NUMBER }}
              brainglobe-${{ runner.os }}-
              brainglobe

      - if: ${{ steps.atlas-cache.outputs.cache-hit == 'true' }}
        name: List files in brainglobe data folder # good to be able to sanity check that user data is as expected
        run: |
          ls -af ~/.brainglobe/


      # Run tests
      - name: Run tests
        uses: neuroinformatics-unit/actions/test-uv@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}
          use-headless: 'true'

      - name: Run tests against napari main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: neuroinformatics-unit/actions/test-uv@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}
          use-headless: 'true'
          install-main-branch: 'napari/napari'

      - name: Notify slack on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # v2.5.0
        with:
          status: ${{ job.status }} # required
          notify_when: 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFYBOT_WEBHOOK_URL }} # required


  build_sdist_wheels:
    name: Build source distribution
    needs: [test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/build_sdist_wheels@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0


  upload_all:
    name: Publish build distributions
    needs: [build_sdist_wheels]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: artifact
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.12.3
      with:
        user: __token__
        password: ${{ secrets.TWINE_API_KEY }}
